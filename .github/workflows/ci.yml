# Typecheck, unit tests, end-to-end tests and the integration tests in real VS Code.
# Read-only access, no secrets, and actions pinned to exact commits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installera beroenden utan installationsskript
        run: npm ci --ignore-scripts

      - name: Typkontroll
        run: npm run typecheck

      - name: Enhetstester
        run: npm run test:unit

      - name: Tester från början till slut
        run: npm run test:e2e

      - name: Virtuell skärm för VS Code
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Integrationstester i VS Code
        run: xvfb-run -a npm run test:integration
